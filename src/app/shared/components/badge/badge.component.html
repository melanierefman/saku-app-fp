<span
  [class]="badgeClasses"
  [attr.aria-label]="ariaLabel || null"
  (click)="onBadgeClick($event)"
>
  <!-- Dot Status Indicator -->
  @if (dot) {
    <span class="relative flex items-center justify-center h-2 w-2">
      @if (dotPulse) {
        <span [class]="pulsePingClasses"></span>
      }
      <span [class]="dotClasses"></span>
    </span>
  }

  <!-- Left Icon Slot -->
  <ng-content select="[iconLeft]"></ng-content>

  <!-- Default Content -->
  <span><ng-content></ng-content></span>

  <!-- Right Icon Slot -->
  <ng-content select="[iconRight]"></ng-content>

  <!-- Removable Close Action (Lucide X icon) -->
  @if (removable) {
    <button
      type="button"
      (click)="onRemoveClick($event)"
      class="-mr-1 ml-0.5 inline-flex items-center justify-center h-4 w-4 rounded-full hover:bg-black/10 active:bg-black/20 focus:outline-none transition-colors duration-100 cursor-pointer"
      aria-label="Hapus badge"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3 h-3 lucide lucide-x"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  }
</span>
