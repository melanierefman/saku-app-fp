<div class="w-full space-y-1.5">
  <!-- Label -->
  @if (label) {
    <label
      [for]="id"
      class="block text-sm font-medium text-neutral-60"
    >
      {{ label }}
      @if (required) {
        <span class="text-error ml-0.5">*</span>
      }
    </label>
  }

  <!-- Number Stepper Wrapper -->
  <div [class]="wrapperClasses">
    <!-- Minus Button (Left) -->
    <button
      type="button"
      (click)="decrement()"
      [disabled]="disabled || readonly || isAtMin"
      class="px-3.5 py-2 flex items-center justify-center text-neutral-60 hover:bg-black/5 hover:text-neutral-90 disabled:opacity-30 disabled:cursor-not-allowed border-r border-[#E5E7EB] transition-colors cursor-pointer"
      aria-label="Kurangi nilai"
    >
      <svg lucideMinus [size]="14" class="w-3.5 h-3.5"></svg>
    </button>

    <!-- Core Number Input -->
    <input
      [id]="id"
      type="number"
      [value]="numValue !== null ? numValue : ''"
      [placeholder]="placeholder"
      [min]="min"
      [max]="max || null"
      [step]="step"
      [disabled]="disabled"
      [readOnly]="readonly"
      [required]="required"
      class="w-full bg-transparent px-3.5 py-2 text-sm font-normal text-neutral-100 placeholder:text-neutral-30 focus:outline-none disabled:cursor-not-allowed [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    <!-- Optional Suffix (e.g. %) -->
    @if (suffix) {
      <span class="pr-3 text-sm text-neutral-50 font-medium select-none">
        {{ suffix }}
      </span>
    }

    <!-- Plus Button (Right) -->
    <button
      type="button"
      (click)="increment()"
      [disabled]="disabled || readonly || isAtMax"
      class="px-3.5 py-2 flex items-center justify-center text-primary hover:bg-primary-0/60 disabled:opacity-30 disabled:cursor-not-allowed border-l border-[#E5E7EB] transition-colors cursor-pointer font-bold"
      aria-label="Tambah nilai"
    >
      <svg lucidePlus [size]="14" class="w-3.5 h-3.5"></svg>
    </button>
  </div>

  <!-- Helper Text or Error Message -->
  @if (errorMessage) {
    <p class="text-xs text-error flex items-center gap-1 mt-1">
      <svg lucideCircleAlert [size]="14" class="w-3.5 h-3.5 shrink-0"></svg>
      <span>{{ errorMessage }}</span>
    </p>
  } @else if (helperText) {
    <p class="text-xs text-neutral-40 mt-1">
      {{ helperText }}
    </p>
  }
</div>
