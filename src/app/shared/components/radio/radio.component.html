<div class="flex items-center gap-2.5" [class.items-start]="description">
  <!-- Radio Outer Circle -->
  <div role="radio" [attr.aria-checked]="isChecked" [attr.aria-disabled]="disabled" tabindex="0" (click)="onSelect()"
    (keydown.space)="$event.preventDefault(); onSelect()" (keydown.enter)="$event.preventDefault(); onSelect()"
    [class]="circleClasses" [class.mt-0.5]="description">
    <!-- Radio Inner Dot (when checked) -->
    @if (isChecked) {
    <span class="w-2.5 h-2.5 rounded-full bg-primary animate-scaleIn"></span>
    }
  </div>

  <!-- Label & Description Text -->
  @if (label || description) {
  <div class="select-none">
    @if (label) {
    <label (click)="onSelect()"
      [class]="disabled ? 'text-neutral-40 cursor-not-allowed' : 'text-neutral-80 cursor-pointer hover:text-neutral-100'"
      class="block text-sm leading-snug">
      {{ label }}
    </label>
    }
    @if (description) {
    <p class="text-xs text-neutral-40 mt-0.5 leading-relaxed">
      {{ description }}
    </p>
    }
  </div>
  }
</div>
