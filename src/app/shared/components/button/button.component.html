<button
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-busy]="loading"
  [class]="buttonClasses"
  (click)="onClick($event)"
>
  <!-- Loading Spinner with Lucide loader-2 SVG -->
  @if (loading) {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="animate-spin -ml-0.5 mr-1.5 w-4 h-4 lucide lucide-loader-2 shrink-0"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
  }

  <!-- Left Icon Slot -->
  <ng-content select="[iconLeft]"></ng-content>

  <!-- Default Content -->
  <span class="inline-flex items-center gap-1.5 whitespace-nowrap"><ng-content></ng-content></span>

  <!-- Right Icon Slot -->
  <ng-content select="[iconRight]"></ng-content>
</button>
