<header
  class="h-16 bg-white border-b border-[#E5E7EB] px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30 select-none">
  <!-- Left Header Area (Breadcrumb / Title placeholder) -->
  <div class="flex items-center gap-3">
    <!-- Optional slot or Title -->
    <ng-content select="[headerLeft]"></ng-content>
  </div>

  <!-- Right Header Actions Area -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Notification Bell Icon Button -->
    <button type="button"
      class="p-2 rounded-xl text-neutral-60 hover:text-neutral-90 hover:bg-neutral-0/80 transition-colors relative cursor-pointer"
      title="Notifikasi" aria-label="Notifikasi">
      <svg lucideBell [size]="20" class="w-5 h-5"></svg>
      <!-- Red unread dot indicator -->
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full ring-2 ring-white"></span>
    </button>

    <!-- Help / FAQ Question Icon Button -->
    <button type="button"
      class="p-2 rounded-xl text-neutral-60 hover:text-neutral-90 hover:bg-neutral-0/80 transition-colors cursor-pointer"
      title="Bantuan & Dukungan" aria-label="Bantuan">
      <svg lucideCircleHelp [size]="20" class="w-5 h-5"></svg>
    </button>

    <!-- Vertical Separator Divider -->
    <div class="h-7 w-[1px] bg-neutral-20 mx-1"></div>

    <!-- User Profile Dropdown Trigger -->
    <div class="relative">
      <button type="button" (click)="toggleUserDropdown()"
        class="flex items-center gap-3 pl-2 py-1 pr-1.5 rounded-xl hover:bg-neutral-0/80 transition-colors cursor-pointer text-left focus:outline-none">
        <!-- User Name & Role Text Column -->
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-sm font-semibold text-neutral-90 leading-tight">
            {{ userName }}
          </span>
          <span class="text-[11px] font-bold text-neutral-40 uppercase tracking-wider mt-0.5 leading-tight">
            {{ userRoleDisplay }}
          </span>
        </div>

        <!-- User Avatar Circle -->
        <div
          class="w-9 h-9 rounded-full bg-primary/10 text-primary border border-primary/20 flex items-center justify-center font-bold text-xs shrink-0 select-none shadow-sm">
          {{ userInitials }}
        </div>

        <!-- Dropdown Chevron -->
        <svg lucideChevronDown [size]="16" class="w-4 h-4 text-neutral-40 transition-transform duration-200 hidden sm:block"
          [class.rotate-180]="showUserDropdown"></svg>
      </button>

      <!-- User Dropdown Menu Popover -->
      @if (showUserDropdown) {
      <!-- Backdrop click outside -->
      <div class="fixed inset-0 z-40" (click)="closeUserDropdown()"></div>

      <!-- Dropdown Card -->
      <div
        class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-neutral-10 py-2 z-50 animate-scaleIn origin-top-right text-left">
        <!-- User Info in dropdown for mobile -->
        <div class="px-4 py-2.5 border-b border-neutral-10 sm:hidden">
          <p class="text-sm font-semibold text-neutral-90 truncate">{{ userName }}</p>
          <p class="text-xs text-neutral-40 uppercase font-medium">{{ userRoleDisplay }}</p>
        </div>

        <!-- Menu Links -->
        <a routerLink="/profile" (click)="closeUserDropdown()"
          class="flex items-center gap-2.5 px-4 py-2.5 text-sm text-neutral-70 hover:text-neutral-90 hover:bg-neutral-0/80 transition-colors">
          <svg lucideUserRound [size]="16" class="w-4 h-4 text-neutral-40"></svg>
          Profil Saya
        </a>

        <div class="border-t border-neutral-10 my-1"></div>

        <!-- Logout Action Button -->
        <button type="button" (click)="openLogoutModal()"
          class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-error hover:bg-error/10 transition-colors cursor-pointer text-left">
          <svg lucideLogOut [size]="16" class="w-4 h-4 text-error"></svg>
          Keluar
        </button>
      </div>
      }
    </div>
  </div>
</header>

<!-- Logout Confirmation Dialog Modal -->
<app-modal
  [isOpen]="showLogoutModal"
  variant="confirm"
  icon="alert"
  message="Apakah Anda yakin ingin keluar dari akun Anda?"
  confirmText="Ya, Keluar"
  cancelText="Batal"
  confirmVariant="primary"
  (confirm)="onConfirmLogout()"
  (close)="showLogoutModal = false"
  (cancel)="showLogoutModal = false"
>
</app-modal>
