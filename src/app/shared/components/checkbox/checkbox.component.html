<div class="flex items-center gap-2.5" [class.items-start]="description">
  <!-- Checkbox Visual Box -->
  <div
    role="checkbox"
    [attr.aria-checked]="indeterminate ? 'mixed' : checked"
    [attr.aria-disabled]="disabled"
    tabindex="0"
    (click)="toggle()"
    (keydown.space)="$event.preventDefault(); toggle()"
    (keydown.enter)="$event.preventDefault(); toggle()"
    [class]="boxClasses"
    [class.mt-0.5]="description"
  >
    @if (indeterminate) {
      <!-- Minus icon for indeterminate -->
      <svg class="w-3 h-3 text-white stroke-[3]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" x2="19" y1="12" y2="12" />
      </svg>
    } @else if (checked) {
      <!-- Checkmark icon -->
      <svg class="w-3 h-3 text-white stroke-[3]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    }
  </div>

  <!-- Label & Description Text -->
  @if (label || description) {
    <div class="select-none">
      @if (label) {
        <label
          (click)="toggle()"
          [class]="disabled ? 'text-neutral-40 cursor-not-allowed' : 'text-neutral-80 cursor-pointer font-medium hover:text-neutral-100'"
          class="block text-sm leading-snug"
        >
          {{ label }}
        </label>
      }
      @if (description) {
        <p class="text-xs text-neutral-40 mt-0.5 leading-relaxed">
          {{ description }}
        </p>
      }
      @if (errorMessage) {
        <p class="text-error mt-0.5 font-medium text-xs">
          {{ errorMessage }}
        </p>
      }
    </div>
  }
</div>
