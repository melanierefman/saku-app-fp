<div class="w-full space-y-1.5">
  <!-- Label -->
  @if (label) {
    <label
      [for]="id"
      class="block text-sm font-medium text-neutral-60"
    >
      {{ label }}
      @if (required) {
        <span class="text-error ml-0.5">*</span>
      }
    </label>
  }

  <!-- Input Wrapper -->
  <div [class]="inputWrapperClasses">
    <!-- Left Icon Slot -->
    <div class="pl-3.5 flex items-center pointer-events-none text-neutral-50 empty:hidden">
      <ng-content select="[iconLeft]"></ng-content>
    </div>

    <!-- Prefix Text Addon -->
    @if (prefixText) {
      <span class="pl-3.5 text-sm text-neutral-50 font-medium select-none">
        {{ prefixText }}
      </span>
    }

    <!-- Core HTML Input -->
    <input
      [id]="id"
      [type]="type"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [readOnly]="readonly"
      [required]="required"
      [class]="inputClasses"
      (input)="onInput($event)"
      (blur)="onBlur($event)"
      (focus)="onFocus($event)"
    />

    <!-- Suffix Text Addon -->
    @if (suffixText) {
      <span class="pr-3.5 text-sm text-neutral-50 font-medium select-none">
        {{ suffixText }}
      </span>
    }

    <!-- Right Icon Slot -->
    <div class="pr-3.5 flex items-center text-neutral-50 empty:hidden">
      <ng-content select="[iconRight]"></ng-content>
    </div>
  </div>

  <!-- Helper Text or Error Message -->
  @if (errorMessage) {
    <p class="text-xs text-error flex items-center gap-1 mt-1">
      <svg lucideCircleAlert [size]="14" class="w-3.5 h-3.5 shrink-0"></svg>
      <span>{{ errorMessage }}</span>
    </p>
  } @else if (helperText) {
    <p class="text-xs text-neutral-40 mt-1">
      {{ helperText }}
    </p>
  }
</div>
