<section id="tentang" class="py-20 md:py-28 bg-[#232323] text-white relative overflow-hidden">
  <!-- Subtle Ambient Glow -->
  <div
    class="absolute -right-40 top-1/2 -translate-y-1/2 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none">
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">
      <!-- Left Column: Title & 4 Cards Grid -->
      <div class="lg:col-span-7 space-y-8">
        <h2 class="text-3xl sm:text-4xl font-bold text-white tracking-tight leading-tight max-w-lg">
          15.000+ Orang Udah Percaya, <br class="hidden sm:inline" />
          Giliran Kamu?
        </h2>

        <!-- 2x2 Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          @for (item of benefits; track item.id) {
          <div
            class="bg-[#2D2D2D]/90 border border-white/10 rounded-2xl p-6 hover:border-primary/50 transition-all duration-200 hover:-translate-y-1 group">
            <!-- Orange Icon Box -->
            <div
              class="w-12 h-12 rounded-xl bg-[#494949] text-primary flex items-center justify-center mb-5 group-hover:bg-primary group-hover:text-white transition-colors">
              @if (item.icon === 'percent') {
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="5" x2="5" y2="19" />
                <circle cx="6.5" cy="6.5" r="2.5" />
                <circle cx="17.5" cy="17.5" r="2.5" />
              </svg>
              } @else if (item.icon === 'globe') {
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
              </svg>
              } @else if (item.icon === 'shield-check') {
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                <path d="m9 12 2 2 4-4" />
              </svg>
              } @else if (item.icon === 'headset') {
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z" />
                <path d="M21 16v2a4 4 0 0 1-4 4h-5" />
              </svg>
              }
            </div>

            <!-- Title -->
            <h3 class="text-xl font-bold text-white/95 leading-snug">
              {{ item.title }}
            </h3>
          </div>
          }
        </div>
      </div>

      <!-- Right Column: Double Phone Mockup -->
      <div class="lg:col-span-5 flex justify-center items-center">
        <div class="relative max-w-[240px] sm:max-w-[300px] transition-transform duration-300 hover:scale-[1.02]">
          <img src="/landing/phone-double.png" alt="SAKU Mobile Application Interface"
            class="w-full h-auto drop-shadow-2xl select-none" />
        </div>
      </div>
    </div>
  </div>
</section>
