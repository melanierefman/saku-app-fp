spring.application.name=backend-saku

# Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

## Auth
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl-minutes=15

# CORS
app.security.cors-allowed-origins=http://localhost:3000,http://localhost:5173
app.redis.key-prefix=${REDIS_KEY_PREFIX:${spring.profiles.active:dev}}
app.redis.host=${REDIS_HOST}
app.redis.port=${REDIS_PORT}
app.redis.timeout=${REDIS_TIMEOUT}
app.redis.username=${REDIS_USERNAME}
app.redis.password=${REDIS_PASSWORD}
app.redis.lettuce-pool-max-active=100
app.redis.lettuce-pool-max-wait=1ms
app.redis.lettuce-pool-max-idle=50
app.redis.lettuce-pool-min-idle=10


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.jdbc.bind=TRACE