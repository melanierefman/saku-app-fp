services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saku-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: saku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-user_saku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db_saku}
      POSTGRES_DB: ${DB_NAME:-db_saku}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: saku-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
