services:
  # ==========================================
  # SAKU Spring Boot Backend Application
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saku-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
