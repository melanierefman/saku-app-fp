spring.application.name=backend-saku-test

# Database Connection (for test environments)
spring.datasource.url=jdbc:postgresql://localhost:5433/saku_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Auth & Security
app.security.jwt-secret=test_jwt_secret_key_that_is_at_least_256_bits_long_for_security_testing_purpose
app.security.jwt-ttl-minutes=15
app.otp.expiry-minutes=5
app.security.cors-allowed-origins=http://localhost:4200

# Redis
app.redis.host=localhost
app.redis.port=6379
app.redis.timeout=2000
app.redis.key-prefix=test

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
