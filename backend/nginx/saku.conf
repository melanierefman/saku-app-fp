# ==============================================================
# 1. HTTP (Port 80) -> Certbot ACME Challenge & Reverse Proxy
# ==============================================================
server {
    listen 80;
    listen [::]:80;
    server_name saku.morpkhai.web.id;

    client_max_body_size 25M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect otomatis HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================
# 2. HTTPS (Port 443) -> SSL Let's Encrypt & Reverse Proxy
# ==============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name saku.morpkhai.web.id;

    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/saku.morpkhai.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saku.morpkhai.web.id/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ----------------------------------------------------------
    # A. Optimasi Khusus: Server-Sent Events (Real-Time SSE)
    # ----------------------------------------------------------
    location /api/realtime/ {
        proxy_pass http://127.0.0.1:8080/api/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WAJIB dimatikan agar notifikasi SSE real-time tidak tertahan buffer Nginx
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ----------------------------------------------------------
    # B. Seluruh Endpoint API Spring Boot, OpenAPI & Scalar Docs
    # ----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
