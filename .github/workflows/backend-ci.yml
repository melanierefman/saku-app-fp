name: SAKU Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI: Build and Run Automated Tests
  # ==========================================
  build-and-test:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saku_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven Wrapper Executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build and Test with Maven
        working-directory: ./backend
        env:
          DB_URL: jdbc:postgresql://localhost:5433/saku_db
          DB_USERNAME: postgres
          DB_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_TIMEOUT: 2000
          REDIS_KEY_PREFIX: test
          JWT_SECRET: default_test_jwt_secret_key_minimum_256_bits_length_for_testing
        run: ./mvnw clean test -B

  # ==========================================
  # 2. CD: Continuous Deployment via SCP & Docker
  # ==========================================
  deploy:
    name: Deploy to Production Server via SCP & Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate .env from GitHub Secret (if provided)
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -n "$PROD_ENV_FILE" ]; then
            echo ">>> Creating backend/.env from PROD_ENV_FILE secret..."
            echo "$PROD_ENV_FILE" > backend/.env
          else
            echo ">>> PROD_ENV_FILE secret not provided, using server/template .env."
          fi

      - name: Generate Firebase Service Account from GitHub Secret (if provided)
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SECRET" ]; then
            echo ">>> Creating firebase-service-account.json from FIREBASE_SERVICE_ACCOUNT_JSON secret..."
            mkdir -p backend/src/main/resources
            echo "$FIREBASE_SECRET" > backend/src/main/resources/firebase-service-account.json
          else
            echo ">>> FIREBASE_SERVICE_ACCOUNT_JSON secret not provided."
          fi

      - name: Generate Dummy Upload Files
        run: |
          cd backend
          node database/generate-dummy-files.js
          tar -czf dummy-uploads.tar.gz uploads

      - name: Transfer Backend Files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "backend/pom.xml,backend/Dockerfile,backend/docker-compose.yml,backend/.dockerignore,backend/.env*,backend/src/**,backend/nginx/**,backend/database/**,backend/dummy-uploads.tar.gz"
          target: "~/backend"
          strip_components: 1

      - name: Deploy Containers on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo ">>> Navigating to ~/backend on server..."
            cd ~/backend

            # Ensure .env exists (fallback to .env.example if not yet created)
            if [ ! -f .env ] && [ -f .env.example ]; then
              echo ">>> Initializing .env from template..."
              cp .env.example .env
            fi

            # Extract dummy upload files if transferred
            if [ -f dummy-uploads.tar.gz ]; then
              echo ">>> Extracting dummy upload files..."
              tar -xzf dummy-uploads.tar.gz
              rm -f dummy-uploads.tar.gz
            fi

            # Ensure uploads directory exists with proper permissions
            sudo mkdir -p uploads
            sudo chown -R $USER:$USER uploads 2>/dev/null || true
            sudo chmod -R 777 uploads 2>/dev/null || true



            # Sync Nginx configuration & Auto-SSL for saku.morpkhai.web.id
            if [ -f nginx/saku.conf ]; then
              echo ">>> Configuring Nginx & Auto-SSL for saku.morpkhai.web.id..."
              sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/conf.d /var/www/certbot || true

              # Ensure nginx and certbot are installed on server
              if ! command -v nginx >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
                echo ">>> Installing nginx and certbot..."
                sudo apt-get update && sudo apt-get install -y nginx certbot || true
                sudo systemctl enable nginx || true
                sudo systemctl start nginx || true
              fi

              # Remove default Nginx site to avoid port 80 conflicts
              sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true

              # 1. If SSL cert does not exist yet, bootstrap HTTP port 80 first
              if ! sudo test -f /etc/letsencrypt/live/saku.morpkhai.web.id/fullchain.pem; then
                echo ">>> SSL cert not found. Bootstrapping HTTP port 80..."
                if [ -f nginx/saku-bootstrap.conf ]; then
                  sudo cp nginx/saku-bootstrap.conf /etc/nginx/sites-available/saku
                  sudo cp nginx/saku-bootstrap.conf /etc/nginx/conf.d/saku.conf 2>/dev/null || true
                  sudo ln -sf /etc/nginx/sites-available/saku /etc/nginx/sites-enabled/ 2>/dev/null || true
                  if sudo nginx -t; then
                    sudo systemctl restart nginx 2>/dev/null || sudo service nginx restart 2>/dev/null || true
                    echo ">>> Bootstrap HTTP port 80 active."
                  fi
                fi

                echo ">>> Requesting Let's Encrypt SSL certificate via Certbot..."
                sudo certbot certonly --webroot -w /var/www/certbot -d saku.morpkhai.web.id --non-interactive --agree-tos --register-unsafely-without-email || true
              fi

              # 2. If SSL cert now exists, apply full HTTPS configuration
              if sudo test -f /etc/letsencrypt/live/saku.morpkhai.web.id/fullchain.pem; then
                echo ">>> Applying full HTTPS Nginx configuration..."
                sudo cp nginx/saku.conf /etc/nginx/sites-available/saku
                sudo cp nginx/saku.conf /etc/nginx/conf.d/saku.conf 2>/dev/null || true
                sudo ln -sf /etc/nginx/sites-available/saku /etc/nginx/sites-enabled/ 2>/dev/null || true
                if sudo nginx -t; then
                  sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || sudo systemctl restart nginx 2>/dev/null || true
                  echo ">>> Nginx HTTPS successfully reloaded!"
                fi
              else
                echo ">>> WARNING: SSL certificate generation pending. Bootstrap HTTP configuration remains active."
              fi
            fi

            echo ">>> Building and deploying Docker containers..."
            docker compose up -d --build

            echo ">>> Container status:"
            docker compose ps
            echo ">>> Deployment successfully finished!"
