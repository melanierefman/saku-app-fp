<div
  class="min-h-screen w-full bg-[#FA5A0E] bg-cover bg-center flex items-center justify-center p-4 sm:p-6 relative overflow-hidden"
  style="background-image: url('/auth/login-bg.png');">
  <!-- Ambient backdrop overlay -->
  <div class="absolute inset-0 bg-black/5 pointer-events-none"></div>

  <!-- Centered Floating White Card -->
  <div
    class="w-full max-w-[420px] sm:max-w-[440px] bg-white rounded-[32px] sm:rounded-[36px] shadow-2xl p-7 sm:p-9 relative z-10 animate-scaleIn">
    <!-- Top SAKU Logo -->
    <div class="flex justify-center mb-6">
      <img src="/landing/saku-logo.png" alt="SAKU Logo" class="h-14 sm:h-16 w-auto object-contain select-none" />
    </div>

    <!-- Header Title & Subtitle -->
    <div class="text-center mb-6 space-y-1.5">
      <h1 class="text-xl sm:text-[22px] font-semibold text-neutral-100 tracking-tight">
        Masuk ke Portal SAKU
      </h1>
      <p class="text-sm text-neutral-40 leading-relaxed max-w-[320px] mx-auto">
        Khusus untuk karyawan. Masukkan kredensial yang telah diberikan.
      </p>
    </div>

    <!-- Form Container -->
    <form (ngSubmit)="onLogin()" class="space-y-4 text-left">
      <!-- Field 1: Email / Username -->
      <app-input label="Email/username" type="text" placeholder="Masukkan email/username" [(ngModel)]="emailOrUsername"
        name="emailOrUsername" [errorMessage]="emailError" (inputChange)="emailError = ''"></app-input>

      <!-- Field 2: Password -->
      <div class="w-full space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="block text-sm font-medium text-neutral-60">
            Password
          </label>
          <a routerLink="/forgot-password"
            class="text-xs font-semibold text-primary hover:text-primary-60 hover:underline transition-colors cursor-pointer">
            Lupa Password?
          </a>
        </div>

        <app-input [type]="showPassword ? 'text' : 'password'" placeholder="Masukkan password" [(ngModel)]="password"
          name="password" [errorMessage]="passwordError" (inputChange)="passwordError = ''">
          <!-- Right Eye Toggle Icon -->
          <button iconRight type="button" (click)="togglePasswordVisibility()"
            class="p-1 text-neutral-40 hover:text-neutral-70 focus:outline-none cursor-pointer transition-colors"
            [attr.aria-label]="
              showPassword ? 'Sembunyikan password' : 'Tampilkan password'
            ">
            @if (showPassword) {
            <svg lucideEyeOff [size]="16" class="w-4 h-4"></svg>
            } @else {
            <svg lucideEye [size]="16" class="w-4 h-4"></svg>
            }
          </button>
        </app-input>
      </div>

      <!-- Global Error Message if any -->
      @if (errorMessage) {
      <div class="p-3 rounded-xl bg-error-0 border border-error-20 text-error text-xs">
        {{ errorMessage }}
      </div>
      }

      <!-- Submit Button -->
      <div class="pt-2 w-full">
        <app-button variant="primary" size="lg" [fullWidth]="true" class="w-full" [loading]="isLoading" type="submit">
          Masuk
        </app-button>
      </div>
    </form>

    <!-- Bottom Copyright -->
    <div class="mt-6 text-center text-xs text-neutral-40 font-normal">
      &copy; {{ currentYear }} SAKU
    </div>
  </div>
</div>
