<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none">
  @for (toast of toasts(); track toast.id) {
  <div
    class="pointer-events-auto flex items-center justify-between gap-3.5 bg-white border border-[#E5E7EB] rounded-xl shadow-lg px-4 py-3 min-w-[320px] max-w-md animate-toastSlideIn transition-all duration-200"
    role="alert">
    <!-- Left Icon Rounded Box -->
    <div class="shrink-0 flex items-center justify-center">
      <!-- Success Icon -->
      @if (toast.type === 'success') {
      <div class="w-7 h-7 rounded-lg bg-[#E8F8EE] flex items-center justify-center text-success">
        <svg lucideCheck [size]="16" class="w-4 h-4"></svg>
      </div>
      }

      <!-- Error Icon -->
      @else if (toast.type === 'error') {
      <div class="w-7 h-7 rounded-lg bg-[#FDF2F2] flex items-center justify-center text-error">
        <svg lucideX [size]="16" class="w-4 h-4"></svg>
      </div>
      }

      <!-- Warning Icon -->
      @else if (toast.type === 'warning') {
      <div class="w-7 h-7 rounded-lg bg-[#FFFBEB] flex items-center justify-center text-warning">
        <svg lucideCircleAlert [size]="16" class="w-4 h-4"></svg>
      </div>
      }

      <!-- Info Icon -->
      @else {
      <div class="w-7 h-7 rounded-lg bg-primary-0 flex items-center justify-center text-primary">
        <svg lucideInfo [size]="16" class="w-4 h-4"></svg>
      </div>
      }
    </div>

    <!-- Toast Message Text -->
    <span class="text-sm font-normal text-neutral-80 flex-1 leading-snug">
      {{ toast.message }}
    </span>

    <!-- Right Close Dismiss Button -->
    <button type="button" (click)="dismiss(toast)"
      class="text-neutral-40 hover:text-neutral-90 p-1 rounded-md hover:bg-neutral-0/60 transition-colors cursor-pointer shrink-0"
      aria-label="Tutup notifikasi">
      <svg lucideX [size]="16" class="w-4 h-4"></svg>
    </button>
  </div>
  }
</div>
