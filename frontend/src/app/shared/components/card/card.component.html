<div [class]="containerClasses">
  @if (loading) {
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-3 pb-3.5 border-b border-[#F3F4F6]">
      <app-skeleton variant="rect" width="w-8" height="h-8" rounded="xl"></app-skeleton>
      <div class="flex flex-col gap-2 flex-1">
        <app-skeleton variant="text" width="w-1/3" height="h-4"></app-skeleton>
        <app-skeleton variant="text" width="w-1/2" height="h-3"></app-skeleton>
      </div>
    </div>
    <div class="flex flex-col gap-3 pt-1">
      <app-skeleton variant="text" width="w-full" height="h-3.5"></app-skeleton>
      <app-skeleton variant="text" width="w-5/6" height="h-3.5"></app-skeleton>
      <app-skeleton variant="text" width="w-4/6" height="h-3.5"></app-skeleton>
    </div>
  </div>
  } @else {
  <!-- Card Header -->
  @if (title || subtitle) {
  <div class="flex items-center justify-between gap-3 pb-3.5" [class.border-b]="headerBorder"
    [class.border-[#F3F4F6]]="headerBorder">
    <!-- Left: Icon & Title/Subtitle -->
    <div class="flex items-center gap-3 min-w-0" [class.items-start]="subtitle">
      <!-- Icon Slot -->
      @if (showIcon) {
      <div [class]="iconContainerClasses" class="card-icon-box">
        <ng-content select="[card-icon], [icon]"></ng-content>
      </div>
      }

      <!-- Title & Subtitle -->
      <div class="min-w-0 flex-1">
        <h2 class="text-base font-semibold text-neutral-90 tracking-tight truncate">
          {{ title }}
        </h2>
        @if (subtitle) {
        <p class="text-xs text-neutral-40 mt-0.5 font-normal leading-relaxed">
          {{ subtitle }}
        </p>
        }
      </div>
    </div>

    <!-- Right: Header Actions Slot -->
    <div class="ml-auto flex items-center gap-2 shrink-0 card-actions-box">
      <ng-content select="[card-actions], [card-header-actions], [actions]"></ng-content>
    </div>
  </div>
  }

  <!-- Card Body Content -->
  <div [class]="bodyClass" [class.pt-4]="title || subtitle">
    <ng-content></ng-content>
  </div>

  <!-- Card Footer Slot -->
  <ng-content select="[card-footer], [footer]"></ng-content>
  }
</div>
