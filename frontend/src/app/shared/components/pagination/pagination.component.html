<div class="flex flex-col sm:flex-row items-center justify-between gap-4 select-none text-sm text-neutral-50">
  <!-- Summary Text -->
  @if (showSummary) {
  <div class="text-xs sm:text-sm text-neutral-40">
    Showing <span class="font-bold text-neutral-50">{{ startItem }}-{{ endItem }}</span> of <span
      class="font-bold text-neutral-50">{{ totalItems }}</span>
  </div>
  }

  <!-- Page Size Selector (Optional) & Navigation -->
  <div class="flex items-center gap-3">
    @if (showPageSize) {
    <div class="flex items-center gap-2 text-xs text-neutral-60">
      <span>Baris per halaman:</span>
      <select [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)"
        class="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg px-2 py-1 text-xs text-neutral-80 focus:outline-none focus:border-primary">
        @for (size of pageSizeOptions; track size) {
        <option [value]="size">{{ size }}</option>
        }
      </select>
    </div>
    }

    <!-- Pagination Controls -->
    <nav class="flex items-center gap-1" aria-label="Pagination Navigation">
      <!-- Previous Page Button -->
      <button type="button" (click)="goToPage(currentPage - 1)" [disabled]="currentPage <= 1"
        class="w-8 h-8 rounded-lg border border-[#E5E7EB] bg-white text-neutral-50 hover:text-neutral-90 hover:bg-[#F9FAFB] disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition-colors cursor-pointer"
        aria-label="Halaman sebelumnya">
        <svg lucideChevronLeft [size]="16" class="w-4 h-4"></svg>
      </button>

      <!-- Page Numbers -->
      @for (page of visiblePages; track $index) {
      @if (page === '...') {
      <span class="w-8 h-8 flex items-center justify-center text-xs text-neutral-40 font-medium">
        ...
      </span>
      } @else {
      <button type="button" (click)="goToPage(page)" [class.border]="page === currentPage"
        [class.border-[#D1D5DB]]="page === currentPage" [class.bg-white]="page === currentPage"
        [class.text-neutral-95]="page === currentPage" [class.font-bold]="page === currentPage"
        [class.shadow-xs]="page === currentPage" [class.text-neutral-60]="page !== currentPage"
        [class.hover:text-neutral-90]="page !== currentPage" [class.hover:bg-[#F9FAFB]]="page !== currentPage"
        [class.font-medium]="page !== currentPage"
        class="w-8 h-8 rounded-lg text-xs flex items-center justify-center transition-all cursor-pointer"
        [attr.aria-current]="page === currentPage ? 'page' : null">
        {{ page }}
      </button>
      }
      }

      <!-- Next Page Button -->
      <button type="button" (click)="goToPage(currentPage + 1)" [disabled]="currentPage >= totalPages"
        class="w-8 h-8 rounded-lg border border-[#E5E7EB] bg-white text-neutral-50 hover:text-neutral-90 hover:bg-[#F9FAFB] disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center transition-colors cursor-pointer"
        aria-label="Halaman berikutnya">
        <svg lucideChevronRight [size]="16" class="w-4 h-4"></svg>
      </button>
    </nav>
  </div>
</div>
