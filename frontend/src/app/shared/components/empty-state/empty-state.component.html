<div class="flex flex-col items-center justify-center text-center w-full"
  [class.py-6]="compact" [class.px-4]="compact"
  [class.py-12]="!compact" [class.px-6]="!compact">
  
  <!-- Icon / Illustration Slot -->
  <div class="rounded-2xl bg-neutral-10/40 text-neutral-40 flex items-center justify-center mb-3"
    [class.w-12]="compact" [class.h-12]="compact"
    [class.w-16]="!compact" [class.h-16]="!compact">
    <ng-content select="[empty-icon], [icon]">
      <svg class="stroke-current" [class.w-6]="compact" [class.h-6]="compact" [class.w-8]="!compact" [class.h-8]="!compact"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
      </svg>
    </ng-content>
  </div>

  <!-- Title & Message -->
  <h3 class="font-semibold text-neutral-90 tracking-tight"
    [class.text-sm]="compact" [class.text-base]="!compact">
    {{ title }}
  </h3>
  
  <p class="text-neutral-40 max-w-sm mt-1"
    [class.text-xs]="compact" [class.text-sm]="!compact">
    {{ message }}
  </p>

  <!-- Action Button / Slot -->
  @if (actionText) {
  <div class="mt-4">
    <app-button variant="secondary" size="sm" (click)="onActionClick()">
      {{ actionText }}
    </app-button>
  </div>
  } @else {
  <div class="mt-4">
    <ng-content select="[empty-action], [action]"></ng-content>
  </div>
  }
</div>
